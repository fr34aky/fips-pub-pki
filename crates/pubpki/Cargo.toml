[package]
name = "pubpki"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "I/O for fips-pub-pki: relays, issuer proofs and keys through pubdom-resolve, NIP-44"

# Rule (docs/architecture.md): no cfg(target_os) here either; the phone
# embeds this crate.
[dependencies]
pubpki-core.workspace = true
pubdom-resolve.workspace = true
# The same nostr-sdk pubdom-resolve re-exports (cargo unifies the one
# version); named here only to switch NIP-44 on.
nostr-sdk = { version = "0.44", default-features = false, features = ["nip44"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "macros"] }
tracing.workspace = true
