[workspace]
resolver = "2"
members = ["crates/pubpki-core", "crates/pubpki", "crates/pubpki-acme", "crates/pubpki-cli"]

[workspace.package]
# One version for every crate and binary; a release is this number, a
# CHANGELOG entry and an annotated tag vX.Y.Z on main (CONTRIBUTING.md).
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/fr34aky/fips-pub-pki"

[workspace.dependencies]
pubpki-core = { path = "crates/pubpki-core" }
pubpki = { path = "crates/pubpki" }
pubpki-acme = { path = "crates/pubpki-acme" }
# The issuer binding and the relay client come from fips-pub-domains,
# pinned by commit as fips2go pins them. Bump both together.
pubdom-core = { git = "https://github.com/fr34aky/fips-pub-domains", rev = "e6da51e148e719edd69b6fde5c80cc370e21ae49" }
pubdom-resolve = { git = "https://github.com/fr34aky/fips-pub-domains", rev = "e6da51e148e719edd69b6fde5c80cc370e21ae49" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
